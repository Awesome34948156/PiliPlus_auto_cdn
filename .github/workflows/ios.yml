name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      # media_kit's bundled ffmpeg is 6.0 and has no av1_videotoolbox hwaccel,
      # so AV1 always falls back to libdav1d even on an A17/A18/M-series chip.
      # MPVKit builds one that does, but only as static archives; this stages the
      # relinked dynamic build in their place. Must run after `flutter pub get`
      # (inside patch.ps1) so the pub-cache checkout exists. See lib/scripts/mpvkit.
      - name: Use the AV1-capable libmpv
        run: bash lib/scripts/mpvkit/stage-mpv.sh ios
        env:
          # Taken from whichever repo is building, so a fork that publishes the
          # same release tag works without editing this file. The release assets
          # are public, so the anonymous `curl` in stage-mpv.sh can fetch them.
          IOS_TARBALL: https://github.com/${{ github.repository }}/releases/download/libmpv-0.41-n9.0.2/libmpv-xcframeworks_v0.39.0_ios-universal-video-default.tar.gz

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          # `Payload` must be a real directory so it lands in the archive as the
          # first entry; a canonical ipa always starts with `Payload/`, and some
          # installers reject an archive whose first entry is `Payload/Runner.app/`.
          # zip follows the inner symlink, so the app is still stored as real files.
          mkdir -p Payload
          ln -sf "$PWD/build/ios/iphoneos/Runner.app" Payload/Runner.app
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlus_ios_${{env.version}}.ipa Payload

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_ios_*.ipa

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release
          path: PiliPlus_ios_*.ipa
