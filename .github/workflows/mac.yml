name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-mac-app:
    name: Release Mac
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      # media_kit's bundled ffmpeg is 6.0 and has no av1_videotoolbox hwaccel,
      # so AV1 always falls back to libdav1d even on M-series silicon. MPVKit
      # builds one that has it, but only as static archives; this stages the
      # relinked dynamic build in their place. Must run after `flutter pub get`
      # (inside patch.ps1) so the pub-cache checkout exists, and before the
      # build so `pod install` sees the new framework set. See lib/scripts/mpvkit.
      - name: Use the AV1-capable libmpv
        run: bash lib/scripts/mpvkit/stage-mpv.sh macos
        env:
          # Taken from whichever repo is building, so a fork that publishes the
          # same release tag works without editing this file. The release assets
          # are public, so the anonymous `curl` in stage-mpv.sh can fetch them.
          MACOS_TARBALL: https://github.com/${{ github.repository }}/releases/download/libmpv-0.41-n9.0.2/libmpv-xcframeworks_v0.6.0_macos-universal-video-default.tar.gz

      - name: Build Mac
        run: flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Prepare Upload
        run: |
          set -euo pipefail
          npm install --global create-dmg
          rm -f PiliPlus*.dmg
          # create-dmg styles the volume with Finder AppleScript and returns
          # non-zero on headless CI even when the image is perfectly good, so its
          # exit code alone is not the verdict -- but do not blanket-ignore it
          # either. A *mid-run* failure leaves a truncated PiliPlus.dmg, and the
          # `mv` below would rename that and the Release step would publish the
          # half-written image: worse than a failed build. Verify the artifact
          # instead of trusting the exit code.
          if ! create-dmg build/macos/Build/Products/Release/PiliPlus.app; then
            echo "note: create-dmg exited non-zero; verifying the artifact anyway"
          fi
          dmg=""
          for f in PiliPlus*.dmg; do
            if [ -e "$f" ]; then dmg=$f; break; fi
          done
          [ -n "$dmg" ] || { echo "::error::create-dmg produced no .dmg"; exit 1; }
          size=$(stat -f%z "$dmg")
          echo "artifact: $dmg ($size bytes)"
          [ "$size" -ge 10485760 ] || { echo "::error::$dmg looks truncated ($size bytes)"; exit 1; }

      - name: Rename DMG
        run: mv PiliPlus*.dmg PiliPlus_macos_${{ env.version }}.dmg

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_macos_*.dmg

      - name: Upload macos release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-release
          path: PiliPlus_macos_*.dmg
