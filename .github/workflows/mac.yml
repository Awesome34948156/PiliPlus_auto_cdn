name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-mac-app:
    name: Release Mac
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      # media_kit's bundled ffmpeg is 6.0 and has no av1_videotoolbox hwaccel,
      # so AV1 always falls back to libdav1d even on M-series silicon. MPVKit
      # builds one that has it, but only as static archives; this stages the
      # relinked dynamic build in their place. Must run after `flutter pub get`
      # (inside patch.ps1) so the pub-cache checkout exists, and before the
      # build so `pod install` sees the new framework set. See lib/scripts/mpvkit.
      - name: Use the AV1-capable libmpv
        run: bash lib/scripts/mpvkit/stage-mpv.sh macos
        env:
          MACOS_TARBALL: https://github.com/Awesome34948156/PiliPlus/releases/download/libmpv-0.41-n9.0.2/libmpv-xcframeworks_v0.6.0_macos-universal-video-default.tar.gz

      - name: Build Mac
        run: flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Prepare Upload
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/PiliPlus.app || true
        continue-on-error: true

      - name: Rename DMG
        run: mv PiliPlus*.dmg PiliPlus_macos_${{ env.version }}.dmg

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_macos_*.dmg

      - name: Upload macos release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-release
          path: PiliPlus_macos_*.dmg
